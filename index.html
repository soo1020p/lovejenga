<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>시에나와 로저의 러브젠가</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 고정 바로가기: 맥미니가 지금 열어 둔 러브젠가 주소로 넘겨 줌 */
:root { --bg: #1f1a2e; --ink: #fff4ea; --muted: #b9adc9; --pink: #ff6f91; color-scheme: dark; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  display: flex; align-items: center; justify-content: center; padding: 0 16px; text-align: center; }
main { display: flex; flex-direction: column; gap: 14px; max-width: 360px; }
h1 { font-weight: 400; font-size: 34px; margin: 0; line-height: 1.25; }
h1 em { font-style: normal; color: var(--pink); }
p { margin: 0; color: var(--muted); font-size: 18px; line-height: 1.6; }
a { color: var(--pink); }
</style>
</head>
<body>
<main>
  <h1>시에나와 로저의<br><em>러브젠가</em></h1>
  <p id="msg">게임으로 가는 중이에요…</p>
</main>
<script>
// link.json = 봇이 게임을 열고 닫을 때마다 바꿔 씀. API로 읽어야 바로 반영됨 (Pages 캐시 우회)
const API = "https://api.github.com/repos/soo1020p/lovejenga/contents/link.json?ref=main";
const msg = document.getElementById("msg");
async function getLink() {
  try {
    const r = await fetch(API + "&t=" + Date.now(), { headers: { Accept: "application/vnd.github.raw+json" }, cache: "no-store" });
    if (r.ok) return await r.json();
  } catch (e) {}
  const r = await fetch("link.json?t=" + Date.now(), { cache: "no-store" });
  return r.json();
}
getLink().then((d) => {
  if (d && d.open && d.url) {
    location.replace(d.url.replace(/\/$/, "") + "/" + location.search);   // ?room=코드 도 그대로 넘김
  } else {
    msg.innerHTML = "지금은 러브젠가가 닫혀 있어요.<br>로저에게 열어 달라고 해 주세요.";
  }
}).catch(() => { msg.textContent = "연결을 확인하지 못했어요. 잠시 뒤 새로고침해 주세요."; });
</script>
</body>
</html>
